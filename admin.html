  <style>

    }

    body {

    }

    header {
      background: white;
      padding: 22px;

      flex-wrap: wrap;

      border-radius: 8px;

      font-weight: bold;
    }

    .primary-btn {
      background: #d9789e;
      color: white;
    }

    .logout-btn {
      background: #f3e2e9;
      color: #a34c70;
    }

      margin: 30px auto;
      padding: 0 18px;
    }

    .login-card {
      background: white;
      max-width: 400px;
      margin: 70px auto;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.07);

    .login-card h2 {
      color: #c45b83;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #e8c5d3;
      border-radius: 8px;
      font-size: 15px;

    .login-card button {
      width: 100%;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;

      margin: 0;

      margin-top: 8px;

      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.04);
      border: 1px solid #f4dce6;

/* PRODUCT MANAGEMENT */

.product-card h3 {

}

.product-card p {
  margin: 5px 0;
  font-size: 14px;
}

.product-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.product-actions button {
  padding: 9px 12px;
  background: #f5d5e2;
  color: #9e456d;
}

@media (max-width: 500px) {
  .product-card {
    grid-template-columns: 1fr;
  }

  .product-card img {
    width: 100%;
    height: 180px;

}
    .order-top {
      display: flex;
      justify-content: space-between;

    .detail h4 {
      color: #bd6688;
      margin: 0 0 9px;

    .detail p {

      margin-bottom: 9px;
      font-size: 14px;

      margin: 5px 0;

    .total {

      color: #b9537c;
      font-size: 17px;

    .empty-message {
      text-align: center;
      padding: 40px 15px;
      background: white;
      border-radius: 14px;
      color: #888;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      header {
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
      }

      .header-actions button {

.edit-order-btn {

    // ESCAPE CUSTOMER DATA BEFORE DISPLAYING IT

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];
      });
    }

    function money(value) {
      if (value === null || value === undefined || value === "") {
        return "To be confirmed";
      }

      return "₱" + Number(value).toLocaleString("en-PH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function showDashboard() {
      loginSection.hidden = true;
      dashboardSection.hidden = false;
      headerActions.hidden = false;
    }

    function showLogin() {
      loginSection.hidden = false;
      dashboardSection.hidden = true;
      headerActions.hidden = true;
    }

    // LOGIN

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      loginButton.disabled = true;
      message.textContent = "Logging in...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        if (data.user.id !== ADMIN_USER_ID) {
          await supabaseClient.auth.signOut();
          throw new Error("This account is not authorized to access the admin dashboard.");
        }

        message.textContent = "Login successful!";
        message.style.color = "green";

      showDashboard();
await loadOrders();
await loadProducts();

      } catch (error) {
        message.textContent = error.message;
        message.style.color = "red";

      } finally {
        loginButton.disabled = false;
      }
    });

      .select("*")
      .order("id", { ascending: true });

    if (error) {
      throw error;
    }

        '<div class="empty-message">No products added yet.</div>';
      return;

        <img

          alt="${escapeHTML(product.name)}"

        <div>

          <p>Status: ${product.is_active ? "Active" : "Inactive"}</p>

      </div>

// FILTER ORDERS

function filterOrders() {
  const searchValue = document
    .getElementById("orderSearch")
    .value.toLowerCase();

  const statusValue = document
    .getElementById("orderStatusFilter")
    .value;

  const paymentValue = document
    .getElementById("paymentStatusFilter")
    .value;

  const orderCards = ordersContainer.querySelectorAll(".order-card");

  orderCards.forEach(card => {
    const customerDetails = card.querySelector(".detail-grid .detail");
    const customerText = customerDetails.textContent.toLowerCase();

    const orderStatus = card.querySelector(".status-select").value;
    const paymentStatus = card.querySelector(".payment-status-select").value;

    const matchesSearch = customerText.includes(searchValue);
    const matchesStatus =
      statusValue === "All" || orderStatus === statusValue;

    const matchesPayment =
      paymentValue === "All" || paymentStatus === paymentValue;

    card.style.display =
      matchesSearch && matchesStatus && matchesPayment ? "" : "none";
  });
}
// UPDATE PAYMENT STATUS

ordersContainer.addEventListener("change", async function(event) {
  if (!event.target.classList.contains("payment-status-select")) {
    return;
  }

  const orderId = event.target.dataset.orderId;
  const newPaymentStatus = event.target.value;

  event.target.disabled = true;

  const { error } = await supabaseClient
    .from("orders")
    .update({ payment_status: newPaymentStatus })
    .eq("id", orderId);

  event.target.disabled = false;

  if (error) {
    alert("Could not update payment status: " + error.message);
    await loadOrders();
    return;
  }

  alert("Payment status updated successfully! ♡");
});
  // SAVE ADMIN NOTES

ordersContainer.addEventListener("click", async function(event) {
  if (!event.target.classList.contains("save-admin-notes")) {
    return;
  }

  const orderId = event.target.dataset.orderId;

  const notesInput = ordersContainer.querySelector(
    `.admin-notes-input[data-order-id="${orderId}"]`
  );

  const newNotes = notesInput.value;

  event.target.disabled = true;

  const { error } = await supabaseClient
    .from("orders")
    .update({ admin_notes: newNotes })
    .eq("id", orderId);

  event.target.disabled = false;

  if (error) {
    alert("Could not save notes: " + error.message);
    return;
  }

  alert("Admin notes saved successfully! ♡");
});
    // ORDER SEARCH AND FILTER EVENTS

document.getElementById("orderSearch").addEventListener("input", filterOrders);

    document.getElementById("refreshButton").addEventListener("click", async function() {
      this.disabled = true;
      await loadOrders();
      this.disabled = false;
    });

    // LOG OUT

    document.getElementById("logoutButton").addEventListener("click", async function() {
      const { error } = await supabaseClient.auth.signOut();

      if (error) {
        alert(error.message);
        return;
      }

      showLogin();
      loginForm.reset();
      message.textContent = "";
      ordersContainer.innerHTML = "";
    });

    // CHECK EXISTING SESSION

    async function initializeAdmin() {
      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        showLogin();
        return;
      }

      const user = data.session?.user;

      if (!user) {
        showLogin();
        return;
      }

      if (user.id !== ADMIN_USER_ID) {
        await supabaseClient.auth.signOut();
        showLogin();
        message.textContent = "Unauthorized account.";
        message.style.color = "red";
        return;
      }

     showDashboard();
await loadOrders();
await loadProducts();
    }

    initializeAdmin();
