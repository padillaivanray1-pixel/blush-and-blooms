    // ESCAPE CUSTOMER DATA BEFORE DISPLAYING IT

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];
      });
    }

    function money(value) {
      if (value === null || value === undefined || value === "") {
        return "To be confirmed";
      }

      return "₱" + Number(value).toLocaleString("en-PH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function showDashboard() {
      loginSection.hidden = true;
      dashboardSection.hidden = false;
      headerActions.hidden = false;

      loginButton.disabled = true;

        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        if (data.user.id !== ADMIN_USER_ID) {
          await supabaseClient.auth.signOut();
          throw new Error("This account is not authorized to access the admin dashboard.");

  if (!currentEditingOrderId) {
    alert("No order selected.");
    return;
  }

  const updatedOrder = {
    customer_name: document.getElementById("editCustomerName").value.trim(),
    phone: document.getElementById("editPhone").value.trim(),

    delivery_fee: document.getElementById("editDeliveryFee").value === ""
  ? null
  : Number(document.getElementById("editDeliveryFee").value),
    total: document.getElementById("editTotal").value === ""
  ? null
  : Number(document.getElementById("editTotal").value)
  };

    !updatedOrder.customer_name ||
    !updatedOrder.phone ||
    !updatedOrder.delivery_address
  ) {
    alert("Please complete the customer name, phone number, and address.");
    return;
  }

 if (
  !Number.isFinite(updatedOrder.subtotal) ||
  (updatedOrder.delivery_fee !== null && !Number.isFinite(updatedOrder.delivery_fee)) ||

  (updatedOrder.total !== null && updatedOrder.total < 0)
) {
  alert("Please enter valid amounts. Amounts cannot be negative.");

}

  saveOrderChanges.disabled = true;

  const { error } = await supabaseClient

// IMPORT PRODUCTS INTO SUPABASE

addProductButton.addEventListener("click", async function() {

  if (allProducts.length > 0) {
    alert("Products already exist. Import cancelled.");
    return;
  }

  const { data: existingRows, error: checkError } = await supabaseClient
    .from("products")
    .select("id")
    .limit(1);

  if (checkError) {
    alert("Could not check products: " + checkError.message);
    return;
  }

  if (existingRows.length > 0) {
    alert("Products already exist. Import cancelled.");
    await loadProducts();
    return;
  }

  if (!confirm("Import all 14 existing products into Supabase?")) {
    return;
  }

  addProductButton.disabled = true;

  try {
    const { error } = await supabaseClient
      .from("products")
      .insert(existingProducts);

    if (error) {
      throw error;
    }

    alert("14 products imported successfully! ♡");
    await loadProducts();

  } catch (error) {
    alert("Import failed: " + error.message);

  } finally {
    addProductButton.disabled = false;
  }
});

// PREVIEW PRODUCT IMAGE

document.getElementById("productImage").addEventListener("change", function() {
  const file = this.files[0];
  const preview = document.getElementById("productImagePreview");

  preview.innerHTML = "";

  if (!file) {
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    alert("Please choose a JPG, PNG, or WebP image.");
    this.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Product photo must not exceed 5 MB.");
    this.value = "";
    return;
  }

  const imageUrl = URL.createObjectURL(file);
  preview.innerHTML = `<img src="${imageUrl}" alt="Product photo preview">`;
});
// SAVE NEW PRODUCT WITH PHOTO UPLOAD

document.getElementById("saveProductButton").addEventListener("click", async function() {

  const name = document.getElementById("productName").value.trim();
  const category = document.getElementById("productCategory").value.trim();
  const price = document.getElementById("productPrice").value;
  const description = document.getElementById("productDescription").value.trim();
  const imageFile = document.getElementById("productImage").files[0];
  alert("Photo detected: " + (imageFile ? imageFile.name : "NO PHOTO DETECTED"));

  if (!name || !category) {
    alert("Please enter the product name and category.");
    return;
  }

  if (imageFile && imageFile.size > 5 * 1024 * 1024) {
    alert("Product photo must not exceed 5 MB.");
    return;
  }

  if (imageFile && !["image/jpeg", "image/png", "image/webp"].includes(imageFile.type)) {
    alert("Please choose a JPG, PNG, or WebP image.");
    return;
  }

  const saveButton = document.getElementById("saveProductButton");
  saveButton.disabled = true;

  let imageUrl = null;

  try {

    // UPLOAD PHOTO IF ONE WAS SELECTED

    if (imageFile) {
      const fileExtension = imageFile.name.split(".").pop().toLowerCase();
      const filePath = `${crypto.randomUUID()}.${fileExtension}`;

      const { error: uploadError } = await supabaseClient
        .storage
        .from("product-images")
        .upload(filePath, imageFile);

      if (uploadError) {
        throw uploadError;
      }

      const { data: publicUrlData } = supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);

      imageUrl = publicUrlData.publicUrl;
    }

    // SAVE PRODUCT DETAILS

    const { error } = await supabaseClient
      .from("products")
      .insert([{
        name: name,
        category: category,
        price: price ? Number(price) : null,
        description: description,
        image: imageUrl,
        options: {},
        pricing: {},
        is_active: true
      }]);

    if (error) {
      throw error;
    }

    alert("Product added successfully! ♡");

    document.getElementById("productModal").style.display = "none";

    document.getElementById("productName").value = "";
    document.getElementById("productCategory").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productImagePreview").innerHTML = "";

    await loadProducts();

  } catch (error) {
    alert("Could not save product: " + error.message);

  } finally {
    saveButton.disabled = false;
  }

});
 
// LOAD PRODUCTS

async function loadProducts() {
  productsContainer.innerHTML =
    '<div class="empty-message">Loading products...</div>';

  try {
    const { data: products, error } = await supabaseClient
      .from("products")
      .select("*")
      .order("id", { ascending: true });

    if (error) {
      throw error;
    }

    allProducts = products;

    if (products.length === 0) {
      productsContainer.innerHTML =
        '<div class="empty-message">No products added yet.</div>';
      return;
    }

    productsContainer.innerHTML = products.map(product => `
      <div class="product-card">
        <img
          src="${escapeHTML(product.image || "")}"
          alt="${escapeHTML(product.name)}"
        >

        <div>
          <h3>${escapeHTML(product.name)}</h3>
          <p>Category: ${escapeHTML(product.category || "Uncategorized")}</p>
          <p>Price: ${money(product.price)}</p>
          <p>Status: ${product.is_active ? "Active" : "Inactive"}</p>
        </div>
      </div>
    `).join("");

  } catch (error) {
    console.error("Product loading error:", error);

    productsContainer.innerHTML = `
      <div class="empty-message">
        Could not load products: ${escapeHTML(error.message)}
      </div>
    `;
  }
}

// FILTER ORDERS

function filterOrders() {
  const searchValue = document
    .getElementById("orderSearch")
    .value.toLowerCase();

  const statusValue = document
    .getElementById("orderStatusFilter")
    .value;

  const paymentValue = document
    .getElementById("paymentStatusFilter")
    .value;

  const orderCards = ordersContainer.querySelectorAll(".order-card");

  orderCards.forEach(card => {
    const customerDetails = card.querySelector(".detail-grid .detail");
    const customerText = customerDetails.textContent.toLowerCase();

    const orderStatus = card.querySelector(".status-select").value;
    const paymentStatus = card.querySelector(".payment-status-select").value;

    const matchesSearch = customerText.includes(searchValue);
    const matchesStatus =
      statusValue === "All" || orderStatus === statusValue;

    const matchesPayment =
      paymentValue === "All" || paymentStatus === paymentValue;

    card.style.display =
      matchesSearch && matchesStatus && matchesPayment ? "" : "none";
  });
}

      }

      if (user.id !== ADMIN_USER_ID) {
        await supabaseClient.auth.signOut();
        showLogin();
        message.textContent = "Unauthorized account.";
        message.style.color = "red";
        return;
      }

     showDashboard();
await loadOrders();
await loadProducts();
    }

    initializeAdmin();
  </script>

</body>
